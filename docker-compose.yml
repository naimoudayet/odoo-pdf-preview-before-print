name: pdfprev-20

services:
  db:
    image: postgres:16
    container_name: pdfprev-pg-20
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: pdfprev-odoo-20
    depends_on:
      - db
    ports:
      - "2020:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      PYTHONDONTWRITEBYTECODE: "1"   # else the bind mount fills the tree with __pycache__
    volumes:
      - odoo-data:/var/lib/odoo
      - ./no_pdf_preview_print:/mnt/extra-addons/no_pdf_preview_print
    # Odoo 20 listens on 127.0.0.1 by default; bind all interfaces so the port works
    command: ["odoo", "--http-interface=0.0.0.0"]

volumes:
  db-data:
  odoo-data:
