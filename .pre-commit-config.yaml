# OCA-derived pre-commit pipeline — ODOO_GUIDELINES §15.
#
# Code-quality only: the hand-authored storefront (static/description/) is
# EXCLUDED from every formatter (§15.1), and there is no oca-gen-addon-readme
# hook — the custom README/index.html is authoritative.
#
# Pins below are the CORRECTED set. The scaffolded config cannot bootstrap:
#   oca/maintainer-tools 1a4316c    unresolvable short SHA (repo has no tags)
#   OCA/odoo-pre-commit-hooks v0.0.33  yanked
#   asottile/pyupgrade v3.16.0      crashes on Python 3.14 (tokenize.cookie_re)
#   pre-commit/mirrors-prettier v3.3.3  repo archived, v3 tags removed
exclude: |
  (?x)
  # Hand-authored App Store listing — never reformat (breaks §2.0 sanitizer rules)
  /static/description/|
  # gettext template
  ^.*\.pot$
default_language_version:
  python: python3
  node: "18.17.1"
repos:
  - repo: https://github.com/oca/maintainer-tools
    rev: f9e5ae4c4cb6f540ace14c5c265a59c352a7f22a
    hooks:
      - id: oca-fix-manifest-website
        args: ["https://www.oudayet.com"]
      # oca-gen-addon-readme INTENTIONALLY OMITTED — custom README (§5 / §15.1)

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.9
    hooks:
      - id: oca-checks-odoo-module
        # Three OCA checks contradict ODOO_GUIDELINES:
        #   use-header-comments      §4 MANDATES the copyright header
        #   manifest-superfluous-key §4 mandates explicit application/installable/
        #                            auto_install even at their defaults
        #   prefer-env-translation   §15.3 advisory; plain _() is valid in v19
        #   prefer-readme-rst        §15.1 keeps the hand-authored README.md
        args:
          [
            "--disable=use-header-comments,manifest-superfluous-key,prefer-env-translation,prefer-readme-rst",
          ]
      - id: oca-checks-po

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: /static/description/
      - id: end-of-file-fixer
        exclude: /static/description/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=300"]
      - id: mixed-line-ending
        args: ["--fix=lf"] # LF repo (§15.5) — matches the committed blobs

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        additional_dependencies: ["flake8-bugbear==24.4.26"]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # JS and SCSS only. The OWL template under static/src is hand-formatted
        # and the archived mirror can no longer resolve @prettier/plugin-xml.
        types_or: [javascript, scss]
        exclude: /static/description/

  - repo: local
    hooks:
      - id: pylint-odoo
        name: pylint-odoo
        entry: python -m pylint
        language: system
        files: \.py$
        args: ["--rcfile=.pylintrc-mandatory", "--load-plugins=pylint_odoo"]
